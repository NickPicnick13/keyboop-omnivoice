name: Bug report
description: Reproducible installation or voice API issue. Do not attach private voice samples.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Description
      description: Exclude tokens, personal recordings, transcripts, or private paths.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Mac chip and macOS version
      placeholder: "M2, macOS 15"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
